  property descriptions, multimedia assets, and rich content for hospitality and travel applications. Amadeus partners
  with trusted content providers such as Leonardo to deliver high-quality hotel media through enterprise-grade APIs used
  by online travel agencies, metasearch platforms, and hospitality technology providers.
